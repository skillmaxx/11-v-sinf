name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Prepare files for deployment
        run: |
          mkdir -p dist
          # Faqat HTML, CSS, JS, media fayllarini copy qiling
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.json" \) -not -path "./.git/*" -exec cp {} dist/ \;
          # Agar papkalar bo'lsa (assets, images, etc)
          cp -r assets dist/ 2>/dev/null || true
          cp -r images dist/ 2>/dev/null || true
          cp -r static dist/ 2>/dev/null || true
      
      - name: Optimize HTML files
        run: |
          find dist -name "*.html" -type f 2>/dev/null | while read file; do
            sed -i 's/  */ /g; s/> </></g; s/<!--.*-->//g' "$file" 2>/dev/null || true
          done
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v2
        id: deployment
