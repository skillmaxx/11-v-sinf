<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohibaning Albomi | 11-V Family</title>
    <style>
        :root {
            --primary-bg: #0b0f19; 
            --secondary-bg: #111827;
            --text-main: #f3f4f6;
            --accent-silver: #c0c5ce;
            --accent-glow: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--primary-bg); color: var(--text-main); line-height: 1.6; }

        .album-container { padding: 50px 5% 50px; max-width: 1200px; margin: auto; }
        
        .back-btn {
            display: inline-flex; align-items: center; gap: 10px;
            color: var(--accent-silver); text-decoration: none;
            font-size: 1.1rem; margin-bottom: 2rem; padding: 0.5rem 1rem;
            border-radius: 8px; background-color: var(--secondary-bg);
            border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s ease;
        }
        .back-btn:hover { color: #ffffff; border-color: var(--accent-glow); background-color: rgba(59, 130, 246, 0.1); }

        .student-title { font-size: 2.8rem; color: #ffffff; margin-bottom: 3rem; text-align: center; letter-spacing: 1px; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 2rem;
        }

        .photo-card {
            background-color: var(--secondary-bg);
            border-radius: 12px; overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .photo-card:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.3);
            border-color: var(--accent-glow);
        }

        .photo-card img { width: 100%; height: 340px; object-fit: cover; cursor: pointer; display: block; }

        .lightbox-modal {
            display: none; position: fixed; z-index: 2000; inset: 0;
            background-color: rgba(7, 10, 19, 0.95);
            justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .lightbox-modal.active { display: flex; opacity: 1; }
        .lightbox-content { max-width: 90%; max-height: 85vh; border-radius: 6px; transform: scale(0.9); transition: transform 0.3s ease; }
        .lightbox-modal.active .lightbox-content { transform: scale(1); }
        .lightbox-close { position: absolute; top: 25px; right: 35px; color: #ffffff; font-size: 45px; font-weight: bold; cursor: pointer; user-select: none; }
        .lightbox-close:hover { color: var(--accent-glow); }

        footer { text-align: center; padding: 2rem; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 5rem; }
        @media (max-width: 768px) { .student-title { font-size: 2rem; } .lightbox-close { top: 15px; right: 25px; font-size: 35px; } }
    </style>
</head>
<body>

    <main class="album-container">
        <a href="vinetka.html" class="back-btn">⬅ Orqaga qaytish</a>
        <h1 class="student-title">Sohibaning raqamli albomi</h1>

        <div class="gallery-grid">
            <div class="photo-card"><img src="sohiba (1).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (2).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (3).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (4).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (5).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (6).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (7).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (8).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (9).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (10).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (11).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (12).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (13).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (14).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (15).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (16).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (17).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (18).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (19).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (20).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (21).jpg" alt="Sohiba" class="gallery-img"></div>
            <div class="photo-card"><img src="sohiba (22).jpg" alt="Sohiba" class="gallery-img"></div>
        </div>
    </main>

    <div class="lightbox-modal" id="lightbox">
        <span class="lightbox-close" id="close-btn">&times;</span>
        <img class="lightbox-content" id="lightbox-img" src="" alt="">
    </div>

    <footer>
        <p>&copy; 2026 11-V Family. Maxsus bitiruv albomi.</p>
    </footer>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('close-btn');
        const galleryImages = document.querySelectorAll('.gallery-img');

        galleryImages.forEach(image => {
            image.addEventListener('click', () => {
                lightbox.classList.add('active');
                lightboxImg.src = image.src;
                document.body.style.overflow = 'hidden';
            });
        });

        closeBtn.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => { if (e.target !== lightboxImg) closeLightbox(); });

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
