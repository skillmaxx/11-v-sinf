<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinfdoshimiz Albomi | 11-V Family</title>
    <style>
        :root { --primary-bg: #0b0f19; --secondary-bg: #111827; --text-main: #f3f4f6; --accent-silver: #c0c5ce; --accent-glow: #3b82f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--primary-bg); color: var(--text-main); line-height: 1.6; }
        .album-container { padding: 50px 5%; max-width: 1200px; margin: auto; }
        .back-btn { display: inline-flex; align-items: center; gap: 10px; color: var(--accent-silver); text-decoration: none; font-size: 1.1rem; margin-bottom: 2rem; padding: 0.5rem 1rem; border-radius: 8px; background-color: var(--secondary-bg); border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s ease; }
        .back-btn:hover { color: #ffffff; border-color: var(--accent-glow); background-color: rgba(59, 130, 246, 0.1); }
        .student-title { font-size: 2.8rem; color: #ffffff; margin-bottom: 3rem; text-align: center; letter-spacing: 1px; text-transform: capitalize; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 2rem; }
        .photo-card { background-color: var(--secondary-bg); border-radius: 12px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; }
        .photo-card:hover { transform: scale(1.03); box-shadow: 0 5px 20px rgba(59, 130, 246, 0.3); border-color: var(--accent-glow); }
        .photo-card img { width: 100%; height: 340px; object-fit: cover; cursor: pointer; display: block; background: #1f2937; }
        .lightbox-modal { display: none; position: fixed; z-index: 2000; inset: 0; background-color: rgba(7, 10, 19, 0.95); justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease; }
        .lightbox-modal.active { display: flex; opacity: 1; }
        .lightbox-content { max-width: 90%; max-height: 85vh; border-radius: 6px; transform: scale(0.9); transition: transform 0.3s ease; }
        .lightbox-modal.active .lightbox-content { transform: scale(1); }
        .lightbox-close { position: absolute; top: 25px; right: 35px; color: #ffffff; font-size: 45px; font-weight: bold; cursor: pointer; user-select: none; }
        .lightbox-close:hover { color: var(--accent-glow); }
        footer { text-align: center; padding: 2rem; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 5rem; }
        @media (max-width: 768px) { .student-title { font-size: 2rem; } .lightbox-close { top: 15px; right: 25px; font-size: 35px; } }
    </style>
</head>
<body>
    <main class="album-container">
        <a href="../vinetka.html" class="back-btn">⬅ Orqaga qaytish</a>
        <h1 class="student-title" id="album-title">Bitiruvchi Albomi</h1>
        <div class="gallery-grid" id="gallery-grid"></div>
    </main>

    <div class="lightbox-modal" id="lightbox">
        <span class="lightbox-close" id="close-btn">&times;</span>
        <img class="lightbox-content" id="lightbox-img" src="" alt="">
    </div>

    <footer><p>&copy; 2026 11-V Family. Maxsus bitiruv albomi.</p></footer>

    <script>
        // Manzildan o'quvchi ismini aniqlab olish (?student=Sohiba)
        const urlParams = new URLSearchParams(window.location.search);
        let studentName = urlParams.get('student') || 'Sohiba';
        
        // Sarlavhani o'zgartirish
        document.getElementById('album-title').innerText = studentName + "ning raqamli albomi";

        // Rasmlar nomining kichik shakli (sohiba, diana va h.k.)
        let imgBaseName = studentName.toLowerCase();
        if(studentName === "Gujum kadrlar") imgBaseName = "gujum";

        const grid = document.getElementById('gallery-grid');

        // Har bir o'quvchi uchun avtomatik 25 tagacha rasmni tekshirib yuklaydigan sikl
        for (let i = 1; i <= 25; i++) {
            let card = document.createElement('div');
            card.className = 'photo-card';
            
            let img = document.createElement('img');
            // Birinchi bo'lib standart probelli (.jpg) variantni yuklaydi
            img.src = "../" + studentName + "/" + imgBaseName + " (" + i + ").jpg";
            img.alt = studentName;
            img.className = 'gallery-img';
            
            // Xatoliklarni (Katta harfli JPG, probelsiz yozilgan yoki kichik papka nomlarini) avtomatik hal qiluvchi aqlli skript
            img.onerror = function() {
                if (!this.dataset.step) this.dataset.step = "1";
                let step = parseInt(this.dataset.step);
                
                if (step === 1) {
                    this.dataset.step = "2";
                    this.src = "../" + studentName + "/" + imgBaseName + " (" + i + ").JPG";
                } else if (step === 2) {
                    this.dataset.step = "3";
                    this.src = "../" + studentName + "/" + imgBaseName + i + ".jpg";
                } else if (step === 3) {
                    this.dataset.step = "4";
                    this.src = "../" + studentName + "/" + imgBaseName + i + ".JPG";
                } else if (step === 4) {
                    // Agar rasi umuman yo'q bo'lsa (masalan rasm soni 15 ta bo'lsa, 16-chi xato kartani o'chirib tashlaydi)
                    this.closest('.photo-card').remove();
                }
            };

            card.appendChild(img);
            grid.appendChild(card);
        }

        // Lightbox (Rasmni kattalashtirib ko'rish tizimi)
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('close-btn');

        document.addEventListener('click', function(e) {
            if(e.target && e.target.classList.contains('gallery-img')) {
                lightbox.classList.add('active');
                lightboxImg.src = e.target.src;
                document.body.style.overflow = 'hidden';
            }
        });

        closeBtn.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => { if (e.target !== lightboxImg) closeLightbox(); });
        function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = 'auto'; }
    </script>
</body>
</html>
