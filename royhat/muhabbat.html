<script>
        const grid = document.getElementById('photo-grid');
        // Papka yo'li to'g'ri ko'rsatildi: ../Sayt/Muhabbat/muhabbat
        const folderPath = "../Sayt/Muhabbat/muhabbat";

        // 1-2 rasmlar .JPG formatida
        for (let i = 1; i <= 2; i++) {
            addCard(`${folderPath} (${i}).JPG`);
        }

        // 3-36 rasmlar .jpg formatida
        for (let i = 3; i <= 36; i++) {
            addCard(`${folderPath} (${i}).jpg`);
        }

        function addCard(src) {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.onclick = () => openLightbox(src);
            card.innerHTML = `<img src="${src}" alt="Muhabbat rasm" loading="lazy" onerror="this.parentElement.style.display='none'">`;
            grid.appendChild(card);
        }

        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.add('active');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }
    </script>
