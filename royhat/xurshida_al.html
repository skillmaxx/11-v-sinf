<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xurshidaning Albomi - Bitiruv 2026</title>
    <style>
        /* Umumiy fon va premium quyuq dizayn */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
            color: #fff;
            min-height: 100vh;
        }

        /* Orqaga qaytish tugmasi */
        .back-btn {
            display: inline-block;
            margin: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        .back-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        /* Xurshida profili (Muqova qismi) */
        .profile-container {
            text-align: center;
            padding: 40px 20px;
        }

        .cover-photo {
            width: 220px;
            height: 280px;
            object-fit: cover;
            border-radius: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            transition: 0.5s ease;
        }
        .cover-photo:hover {
            transform: scale(1.05);
            border-color: #00adb5;
            box-shadow: 0 10px 30px rgba(0, 173, 181, 0.5);
        }

        .profile-container h1 {
            margin: 15px 0 5px 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(255,255,255,0.2);
        }

        .profile-container p {
            color: #a0a0b8;
            font-size: 1.1rem;
        }

        /* Foto galereya setkasi */
        .gallery-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        /* Har bitta rasm kartasi */
        .photo-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s ease;
        }

        .photo-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            transition: 0.4s ease;
        }

        .photo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .photo-card:hover img {
            transform: scale(1.03);
        }

        /* Darsxona va tadbir rasmlari uchun maxsus hoshiya */
        .event-photo {
            border: 2px solid rgba(0, 173, 181, 0.3) !important;
        }
    </style>
</head>
<body>

    <!-- Orqaga vinetka sahifasiga qaytish -->
    <a href="vinetka.html" class="back-btn">← Orqaga qaytish</a>

    <!-- Xurshida Muqova qismi -->
    <div class="profile-container">
        <!-- Siz so'ragan xurshida (5).JPG rasm aniq albom yuzi qilindi -->
        <img src="Sayt/Xurshida/xurshida (5).JPG" alt="Allaberganova Xurshida" class="cover-photo">
        <h1>ALLABERGANOVA XURSHIDA</h1>
        <p>11-V Sinf O'quvchisi | Bitiruvchi - 2026</p>
    </div>

    <!-- Fotoalbom rasmlari -->
    <div class="gallery-container">
        
        <!-- Sinf xonasi va tadbirlarda tushilgan rasmlar (photo_2026... seriyasi) -->
        <div class="photo-card event-photo"><img src="Sayt/Xurshida/photo_2026-04-30_19-01-20 (10).jpg"></div>
        <div class="photo-card event-photo"><img src="Sayt/Xurshida/photo_2026-04-30_19-01-41 (13).jpg"></div>
        <div class="photo-card event-photo"><img src="Sayt/Xurshida/photo_2026-04-30_19-01-48 (17).jpg"></div>
        <div class="photo-card event-photo"><img src="Sayt/Xurshida/photo_2026-04-30_19-01-49 (2).jpg"></div>
        <div class="photo-card event-photo"><img src="Sayt/Xurshida/photo_2026-04-30_19-01-49 (3).jpg"></div>
        <div class="photo-card event-photo"><img src="Sayt/Xurshida/photo_2026-04-30_19-01-49 (4).jpg"></div>
        <div class="photo-card event-photo"><img src="Sayt/Xurshida/photo_2026-04-30_19-01-49 (6).jpg"></div>
        <div class="photo-card event-photo"><img src="Sayt/Xurshida/photo_2026-04-30_19-01-49 (8).jpg"></div>
        <div class="photo-card event-photo"><img src="Sayt/Xurshida/photo_2026-04-30_19-01-49.jpg"></div>
        <div class="photo-card event-photo"><img src="Sayt/Xurshida/photo_2026-04-30_19-01-50 (5).jpg"></div>
        <div class="photo-card event-photo"><img src="Sayt/Xurshida/photo_2026-04-30_19-01-50 (8).jpg"></div>
        <div class="photo-card event-photo"><img src="Sayt/Xurshida/photo_2026-04-30_19-02-01 (5).jpg"></div>
        <div class="photo-card event-photo"><img src="Sayt/Xurshida/photo_2026-04-30_19-02-01 (6).jpg"></div>

        <!-- xurshida (1).JPG dan xurshida (18).JPG gacha bo'lgan rasmlarni chizuvchi JavaScript sikli -->
        <script>
            const gallery = document.querySelector('.gallery-container');
            // Jami 18 ta rasmni avtomatik yuklash:
            for (let i = 1; i <= 18; i++) {
                const card = document.createElement('div');
                card.className = 'photo-card';
                
                const img = document.createElement('img');
                img.src = `Sayt/Xurshida/xurshida (${i}).JPG`;
                img.alt = `Xurshida Albom Rasm ${i}`;
                img.loading = 'lazy';
                
                card.appendChild(img);
                gallery.appendChild(card);
            }
        </script>

    </div>

</body>
</html>
