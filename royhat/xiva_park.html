<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiyobon Xotiralari - Bitiruv 2026</title>
    <style>
        /* Umumiy fon va premium to'q dizayn */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
            color: #fff;
            min-height: 100vh;
        }

        /* Orqaga bosh sahifaga qaytish tugmasi */
        .back-btn {
            display: inline-block;
            margin: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        .back-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        /* Albom sarlavhasi va Muqovasi */
        .album-header {
            text-align: center;
            padding: 40px 20px;
        }

        .cover-photo {
            width: 320px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            transition: 0.5s ease;
        }
        .cover-photo:hover {
            transform: scale(1.03);
            border-color: #00adb5;
            box-shadow: 0 10px 30px rgba(0, 173, 181, 0.4);
        }

        .album-header h1 {
            margin: 20px 0 5px 0;
            font-size: 2.8rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(255,255,255,0.1);
        }

        .album-header p {
            color: #a0a0b8;
            font-size: 1.2rem;
        }

        /* Foto galereya setkasi */
        .gallery-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        /* Har bitta rasm kartasi */
        .photo-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: 0.3s ease;
        }

        .photo-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            transition: 0.4s ease;
        }

        .photo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(0, 173, 181, 0.3);
            border-color: rgba(0, 173, 181, 0.4);
        }

        .photo-card:hover img {
            transform: scale(1.04);
        }
    </style>
</head>
<body>

    <!-- Orqaga qaytish -->
    <a href="index.html" class="back-btn">← Bosh sahifaga qaytish</a>

    <!-- Albom sarlavhasi va Muqovasi -->
    <div class="album-header">
        <!-- Siz so'ragan park (225).JPG rasm albom yuzi (muqovasi) qilindi -->
        <img src="Sayt/Park/park (225).JPG" alt="Parkda guruhbop rasm" class="cover-photo">
        <h1>XIYOBON XOTIRALARI</h1>
        <p>11-V Sinfining Parkdagi Unutilmas va Quvnoq Kunlari</p>
    </div>

    <!-- 226 ta rasmni avtomatik joylashtiradigan galereya paneli -->
    <div class="gallery-container">
        
        <script>
            const gallery = document.querySelector('.gallery-container');
            const totalPhotos = 226;

            // 1 dan 226 gacha bo'lgan barcha rasmlarni siklda chiqarish
            for (let i = 1; i <= totalPhotos; i++) {
                const card = document.createElement('div');
                card.className = 'photo-card';
                
                const img = document.createElement('img');
                // Skrinshotdagi barcha rasmlar katta harfli .JPG formatida ekanligini hisobga oldik
                img.src = `Sayt/Park/park (${i}).JPG`;
                img.alt = `11-V Sinf Xiyobonda - Rasm ${i}`;
                img.loading = 'lazy'; // Brauzer qotmasligi uchun dynamic yuklash
                
                card.appendChild(img);
                gallery.appendChild(card);
            }
        </script>

    </div>

</body>
</html>
