<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11-V Sinfi | Abdullayeva Dildora | Shaxsiy Albom</title>
    <!-- FIREBASE REALTIME KUTUBXONALARI -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root {
            --primary-bg: #0a0e1a;
            --secondary-bg: #0f1420;
            --text-main: #e8eef5;
            
            /* PREMIUM SHOXONA OLTIN RANGLARI */
            --accent-main: #eab308; 
            --accent-dark: #ca8a04;
            
            --ig-black: #000000;
            --ig-panel: #121212;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
        body { background: var(--primary-bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        header { background: rgba(15, 20, 32, 0.95); position: fixed; width: 100%; top: 0; z-index: 1000; box-shadow: 0 2px 8px rgba(var(--accent-rgb), 0.08); border-bottom: 1px solid rgba(var(--accent-rgb), 0.1); backdrop-filter: blur(10px); }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 5%; max-width: 1200px; margin: auto; width: 100%; }
        .logo { font-size: 1.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 3px; background: linear-gradient(135deg, var(--accent-main), var(--accent-dark)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .nav-links { list-style: none; display: flex; gap: 2rem; }
        .nav-links a { color: rgba(232, 238, 245, 0.7); text-decoration: none; font-weight: 500; transition: all 0.3s; }
        .nav-links a:hover { color: var(--accent-main); }
        
        .album-container { padding: 140px 5% 50px; max-width: 1200px; margin: auto; flex: 1; width: 100%; }
        .back-btn { display: inline-block; margin-bottom: 2rem; color: var(--accent-main); text-decoration: none; border: 1.5px solid var(--accent-main); padding: 0.7rem 1.8rem; border-radius: 30px; font-weight: 600; transition: all 0.3s; }
        .back-btn:hover { background: rgba(var(--accent-rgb), 0.1); box-shadow: 0 0 15px rgba(var(--accent-rgb), 0.2); }
        
        .profile-header { display: grid; grid-template-columns: 350px 1fr; background: rgba(15, 20, 32, 0.6); border-radius: 24px; overflow: hidden; border: 1.5px solid rgba(var(--accent-rgb), 0.15); margin-bottom: 4rem; box-shadow: 0 8px 24px rgba(var(--accent-rgb), 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.05); }
        .profile-cover-box { width: 100%; height: 450px; overflow: hidden; background: linear-gradient(135deg, rgba(var(--accent-dark-rgb), 0.2), rgba(var(--accent-rgb), 0.2)); }
        .profile-cover-box img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s; }
        .profile-info { padding: 3rem; display: flex; flex-direction: column; justify-content: center; background: rgba(0, 0, 0, 0.2); }
        .profile-info h1 { font-size: 2.5rem; color: #ffffff; margin-bottom: 0.5rem; font-weight: 800; background: linear-gradient(135deg, var(--accent-main), var(--accent-dark)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .class-info { font-size: 1rem; color: var(--accent-main); font-weight: 600; margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 1px; }
        .profile-lyric { font-size: 1.1rem; color: rgba(232, 238, 245, 0.8); font-style: italic; line-height: 1.8; border-left: 3px solid var(--accent-main); padding-left: 20px; }
        
        .gallery-title { font-size: 1.8rem; margin-bottom: 2rem; text-transform: uppercase; border-bottom: 1px solid rgba(var(--accent-rgb), 0.1); padding-bottom: 0.5rem; letter-spacing: 2px; font-weight: 700; }
        
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .photo-card { 
            background: rgba(var(--accent-rgb), 0.03); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(var(--accent-rgb), 0.1);
            border-radius: 16px; 
            overflow: hidden; 
            aspect-ratio: 3/4; 
            cursor: pointer; 
            transition: transform 0.3s ease-out, box-shadow 0.3s ease-out, border-color 0.3s;
            position: relative; 
            contain: layout paint;
            will-change: transform;
            transform: translate3d(0,0,0);
        }
        .photo-card:hover { 
            transform: translateY(-6px) translate3d(0,-6px,0); 
            box-shadow: 0 12px 24px rgba(var(--accent-rgb), 0.15), 0 0 15px rgba(var(--accent-dark-rgb), 0.15);
            border-color: rgba(var(--accent-rgb), 0.25);
        }

        .photo-card img { 
            width: 100%; height: 100%; object-fit: cover; opacity: 0;
            filter: blur(12px) saturate(0.5) scale(1.03);
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), 
                        filter 0.8s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, filter, transform;
            pointer-events: none;
            user-select: none;
        }
        .photo-card img.loaded { opacity: 1; filter: blur(0) saturate(1) scale(1); }

        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.95); z-index: 2000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.2s ease-out; }
        .lightbox.active { display: flex; opacity: 1; }
        
        .lightbox-wrapper { background: var(--ig-panel); max-width: 460px; width: 92%; border-radius: 12px; overflow: hidden; border: 1px solid #262626; display: flex; flex-direction: column; position: relative; transform: scale(0.95); transition: transform 0.25s ease-out; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7); will-change: transform; }
        .lightbox.active .lightbox-wrapper { transform: scale(1); }
        
        .lightbox-img-box { width: 100%; background: var(--ig-black); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; will-change: auto; }
        .lightbox-img { width: 100%; max-height: 65vh; object-fit: contain; cursor: zoom-in; user-select: none; transform-origin: center center; transition: transform 0.2s ease-out; will-change: transform; }
        
        .lightbox-close { position: absolute; top: 15px; right: 15px; color: #fff; font-size: 1.8rem; cursor: pointer; z-index: 25; opacity: 0.6; transition: opacity 0.2s; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .lightbox-close:hover { opacity: 1; }

        .lightbox-panel { padding: 14px 18px; display: flex; flex-direction: column; background: var(--ig-panel); border-top: 1px solid #262626; width: 100%; z-index: 5; }
        .action-bar { display: flex; align-items: center; gap: 20px; justify-content: flex-start; }
        
        .ig-action-btn { background: none; border: none; cursor: pointer; color: #f5f5f5; padding: 4px; display: flex; align-items: center; justify-content: center; transition: transform 0.1s ease; }
        .ig-action-btn:active { transform: scale(1.2); }
        .ig-action-btn svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; }
        
        .like-btn.liked svg { fill: #ec4899; stroke: #ec4899; animation: pulse 0.3s ease-in-out; }
        .likes-count-text { font-size: 0.95rem; font-weight: 700; color: #ffffff; margin-top: 8px; letter-spacing: 0.3px; }

        .big-heart { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); color: #ec4899; font-size: 4rem; pointer-events: none; z-index: 15; opacity: 0; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3)); }
        @keyframes heartPop { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 70% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.8; } 100% { transform: translate(-50%, -50%) scale(0); opacity: 0; } }

        /* SLIDE UP COMMENTS DRAWER */
        .comment-drawer { position: absolute; bottom: 0; left: 0; width: 100%; height: 70%; background: #0f141c; border-top: 1px solid #262626; border-radius: 16px 16px 0 0; z-index: 30; transform: translateY(100%); transition: transform 0.25s ease-out; display: flex; flex-direction: column; padding: 14px 16px; will-change: transform; }
        .comment-drawer.active { transform: translateY(0); }
        
        .drawer-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #262626; margin-bottom: 10px; }
        .drawer-title { font-size: 1rem; font-weight: 600; color: #fff; }
        .drawer-close { color: #737373; font-size: 1.4rem; cursor: pointer; }
        
        .comments-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; font-size: 0.9rem; }
        .comment-item { line-height: 1.4; color: #e5e7eb; word-break: break-word; }
        .comment-user { font-weight: 600; margin-right: 6px; color: #fff; }
        .no-comments { color: #737373; font-size: 0.85rem; font-style: italic; text-align: center; margin-top: 20px; }
        
        .comment-form { display: flex; align-items: center; border-top: 1px solid #262626; padding-top: 10px; margin-top: auto; }
        .comment-input { flex: 1; background: transparent; border: none; padding: 8px 0; color: #fff; font-size: 0.9rem; outline: none; }
        .comment-submit { background: none; border: none; color: var(--accent-main); font-weight: 600; font-size: 0.9rem; cursor: pointer; }

        .lightbox.zoom-active { background: #000; }
        .lightbox.zoom-active .lightbox-wrapper { max-width: 100vw; width: 100%; max-height: 100vh; height: 100vh; border: none; border-radius: 0; background: #000; }
        .lightbox.zoom-active .lightbox-img-box { height: 100vh; }
        .lightbox.zoom-active .lightbox-img { max-height: 100vh; height: 100vh; width: 100vw; cursor: zoom-out; }
        .lightbox.zoom-active .lightbox-panel, .lightbox.zoom-active .lightbox-close, .lightbox.zoom-active .comment-drawer { display: none !important; }

        .comments-list::-webkit-scrollbar { width: 4px; }
        .comments-list::-webkit-scrollbar-thumb { background: #363636; border-radius: 4px; }
        
        footer { text-align: center; padding: 2rem; background: rgba(15, 20, 32, 0.6); margin-top: auto; border-top: 1px solid rgba(var(--accent-rgb), 0.1); }
        footer p { font-size: 0.9rem; color: rgba(232, 238, 245, 0.6); }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.25); } 100% { transform: scale(1); } }

        @media (max-width: 768px) {
            .profile-header { grid-template-columns: 1fr; }
            .profile-cover-box { height: 300px; }
            .photo-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.8rem; }
            .lightbox-wrapper { width: 95%; }
            .lightbox-img { max-height: 60vh; }
            .nav-links { gap: 1rem; font-size: 0.9rem; }
            .photo-card { transition: transform 0.2s ease-out, box-shadow 0.2s ease-out; }
            .photo-card:hover { box-shadow: 0 8px 16px rgba(var(--accent-rgb), 0.1); }
            @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo">11-V Family</div>
            <ul class="nav-links">
                <li><a href="../index.html">Bosh sahifa</a></li>
            </ul>
        </nav>
    </header>

    <main class="album-container">
        <a href="../vinetka.html" class="back-btn">&larr; Orqaga qaytish</a>

        <div class="profile-header">
            <div class="profile-cover-box">
                <img id="profile-cover" src="" alt="Muqova rasm">
            </div>
            <div class="profile-info">
                <div class="class-info">11-V SINFI</div>
                <h1 id="html-album-title">Albom Nomi</h1> 
                <div class="profile-lyric" id="html-album-lyric">
                    "Albom she'ri yoki tavsifi shu yerda bo'ladi."
                </div>
            </div>
        </div>

        <h2 class="gallery-title" id="gallery-header-title">📸 Foto Lavhalar</h2>
        <div class="photo-grid" id="photo-grid"></div>
    </main>

    <!-- LIGHTBOX POST POPUP -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <div class="lightbox-wrapper">
            <div class="lightbox-img-box" id="img-box">
                <span class="lightbox-close" onclick="forceCloseLightbox()">&times;</span>
                <img class="lightbox-img" id="lightbox-img" src="" alt="Rasm">
                <div class="big-heart" id="pop-heart">❤️</div>
            </div>
            
            <div class="lightbox-panel">
                <div class="action-bar">
                    <button class="ig-action-btn like-btn" id="like-button" onclick="toggleLike(event)">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </button>
                    <button class="ig-action-btn" onclick="openCommentDrawer(event)">
                        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    </button>
                </div>
                <div class="likes-count-text" id="like-count">0 ta like</div>
            </div>

            <div class="comment-drawer" id="comment-drawer" onclick="event.stopPropagation()">
                <div class="drawer-header">
                    <span class="drawer-title">Izohlar</span>
                    <span class="drawer-close" onclick="closeCommentDrawer()">&times;</span>
                </div>
                <div class="comments-list" id="comments-container"></div>
                <div class="comment-form">
                    <input type="text" class="comment-input" id="comment-input" placeholder="Izoh qo'shing..." autocomplete="off">
                    <button class="comment-submit" onclick="addComment()">Yuborish</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 11-V Family | <span id="footer-text">Shaxsiy Albom</span>. Barcha huquqlar himoyalangan. ✨</p>
    </footer>

    <script>
        // ==========================================
        // 🛠 ALBOM SOZLAMALARI (Faqat shu yerni o'zgartiring!)
        // ==========================================
        
        // 1. Umumiy ma'lumotlar
        const ALBOM_NOMI = "Abdullayeva Dildora"; 
        const FIREBASE_KODI = "dildora"; 
        const SHIER_YOKI_MATN = `"Ilm sahifalarida porlab yurgan,<br>Mehribon yurakda mehr-oqibat.<br>Kelajak yo'lida baxt topib turgan,<br>Maktab xotiralari — umr davomi..."`;
        
        // 2. Rasm manzillari (Papka)
        const PAPKA_YOLI = "../Dildora/dildora"; 
        
        // 3. Tsikl raqamlari 
        const BOSHLANISH_RAQAMI = 1;
        const TUGASH_RAQAMI = 22;
        const MUQOVA_RASM_RAQAMI = 4; 
        
        // 4. MAVZU RANGLARI (Shoxona Oltin & Warm Gold)
        const THEME_MAIN_COLOR = '#eab308'; 
        const THEME_DARK_COLOR = '#ca8a04'; 

        // ==========================================
        // ==========================================

        // HEX rangni RGB ga o'tkazish
        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : null;
        }

        // Mavzuni HTML ga qo'llash
        document.documentElement.style.setProperty('--accent-main', THEME_MAIN_COLOR);
        document.documentElement.style.setProperty('--accent-dark', THEME_DARK_COLOR);
        document.documentElement.style.setProperty('--accent-rgb', hexToRgb(THEME_MAIN_COLOR));
        document.documentElement.style.setProperty('--accent-dark-rgb', hexToRgb(THEME_DARK_COLOR));

        // Matnlarni HTML ga joylash
        document.title = `11-V Sinfi | ${ALBOM_NOMI} | Shaxsiy Albom`;
        document.getElementById('html-album-title').innerText = ALBOM_NOMI;
        document.getElementById('gallery-header-title').innerText = `📸 ${ALBOM_NOMI}`;
        document.getElementById('footer-text').innerText = ALBOM_NOMI;
        document.getElementById('html-album-lyric').innerHTML = SHIER_YOKI_MATN;

        const firebaseConfig = {
            apiKey: "AIzaSyC4CsBgO5b9hyPF7x57UY19n-2BWS9FyQk",
            authDomain: "v-3f66c.firebaseapp.com",
            databaseURL: "https://v-3f66c-default-rtdb.firebaseio.com",
            projectId: "v-3f66c",
            storageBucket: "v-3f66c.firebasestorage.app",
            messagingSenderId: "497193697293",
            appId: "1:497193697293:web:832393d6753cb4db0b1544"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        function getOrCreateUserId() {
            let uid = localStorage.getItem('v11_user_uuid');
            if(!uid) { uid = 'user_' + Math.random().toString(36).substr(2, 9); localStorage.setItem('v11_user_uuid', uid); }
            return uid;
        }
        const myUid = getOrCreateUserId();

        const grid = document.getElementById('photo-grid');
        const fragment = document.createDocumentFragment(); 
        const extensions = ['.JPG', '.jpg', '.png', '.PNG', '.jpeg', '.JPEG'];
        
        const photoFiles = [
            'photo_2026-04-30_19-02-01',
            'photo_2026-04-30_19-02-01 (2)',
            'photo_2026-04-30_19-02-01 (3)',
            'photo_2026-04-30_19-02-01 (4)',
            'photo_2026-04-30_19-02-14 (6)'
        ];

        const observerOptions = {
            root: null,
            rootMargin: '250px', 
            threshold: 0.05
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    const img = card.querySelector('img');
                    
                    if (img && img.dataset.basepath && !img.dataset.loaded) {
                        let extIndex = 0;
                        const basePath = img.dataset.basepath;
                        
                        function tryLoad() {
                            if (extIndex < extensions.length) {
                                const fullSrc = basePath + extensions[extIndex];
                                img.src = fullSrc;
                                card.onclick = () => openLightbox(fullSrc);
                            } else {
                                card.style.display = 'none'; 
                            }
                        }
                        
                        img.onload = () => {
                            img.classList.add('loaded');
                            img.dataset.loaded = 'true';
                        };
                        img.onerror = () => {
                            extIndex++;
                            tryLoad();
                        };
                        
                        tryLoad();
                    }
                    observer.unobserve(card);
                }
            });
        }, observerOptions);

        // First add numbered images
        for (let i = BOSHLANISH_RAQAMI; i <= TUGASH_RAQAMI; i++) {
            const basePath = `${PAPKA_YOLI} (${i})`;
            const card = document.createElement('div');
            card.className = 'photo-card';
            
            const img = document.createElement('img');
            img.alt = `${ALBOM_NOMI} Foto`;
            img.dataset.basepath = basePath;
            
            card.appendChild(img);
            fragment.appendChild(card);
            observer.observe(card);
        }

        // Then add extra photos
        photoFiles.forEach(name => {
            const basePath = `../Dildora/${name}`;
            const card = document.createElement('div');
            card.className = 'photo-card';
            
            const img = document.createElement('img');
            img.alt = `${ALBOM_NOMI} Extra Foto`;
            img.dataset.basepath = basePath;
            
            card.appendChild(img);
            fragment.appendChild(card);
            observer.observe(card);
        });

        grid.appendChild(fragment);

        const coverImg = document.getElementById('profile-cover');
        let coverIndex = 0;
        coverImg.onerror = () => {
            coverIndex++;
            if(coverIndex < extensions.length) {
                coverImg.src = `${PAPKA_YOLI} (${MUQOVA_RASM_RAQAMI})${extensions[coverIndex]}`;
            }
        };
        coverImg.src = `${PAPKA_YOLI} (${MUQOVA_RASM_RAQAMI})${extensions[0]}`;
        coverImg.onload = () => coverImg.style.opacity = 1;

        let activeImageSrc = ""; let isZoomMode = false;
        let scale = 1, translateX = 0, translateY = 0;

        const lightbox = document.getElementById('lightbox');
        const imgRef = document.getElementById('lightbox-img');
        const popHeart = document.getElementById('pop-heart');
        let dbRefLikes = null; let dbRefComments = null;

        function openLightbox(src) {
            activeImageSrc = src; imgRef.src = src;
            lightbox.style.display = 'flex';
            setTimeout(() => lightbox.classList.add('active'), 10);
            document.body.style.overflow = 'hidden'; 
            closeCommentDrawer(); resetZoom();

            const safeKey = btoa(src).replace(/[^a-zA-Z0-9]/g, "");

            if(dbRefLikes) dbRefLikes.off();
            if(dbRefComments) dbRefComments.off();

            dbRefLikes = database.ref('likes_' + FIREBASE_KODI + '/' + safeKey);
            dbRefComments = database.ref('comments_' + FIREBASE_KODI + '/' + safeKey);

            dbRefLikes.on('value', (snapshot) => {
                requestAnimationFrame(() => {
                    const data = snapshot.val() || {};
                    const totalLikes = Object.keys(data).length;
                    document.getElementById('like-count').innerText = `${totalLikes} ta like`;
                    if (data[myUid]) document.getElementById('like-button').classList.add('liked');
                    else document.getElementById('like-button').classList.remove('liked');
                });
            });

            dbRefComments.on('value', (snapshot) => {
                requestAnimationFrame(() => {
                    const commentsContainer = document.getElementById('comments-container');
                    commentsContainer.innerHTML = '';
                    const data = snapshot.val();
                    if (!data) {
                        commentsContainer.innerHTML = `<span class="no-comments">Hali izohlar yozilmagan. Birinchi bo'ling!</span>`;
                    } else {
                        Object.values(data).forEach(c => {
                            const div = document.createElement('div'); div.className = 'comment-item';
                            div.innerHTML = `<span class="comment-user">Sinfdosh</span>${c.text}`;
                            commentsContainer.appendChild(div);
                        });
                    }
                    commentsContainer.scrollTop = commentsContainer.scrollHeight;
                });
            });
        }

        function toggleLike(event) {
            if (event) event.stopPropagation(); if(!dbRefLikes) return;
            dbRefLikes.transaction((currentData) => {
                if (currentData === null) currentData = {};
                if (currentData[myUid]) delete currentData[myUid];
                else currentData[myUid] = true;
                return currentData;
            });
        }

        function addComment() {
            const input = document.getElementById('comment-input'); const text = input.value.trim();
            if (!text || !dbRefComments) return;
            dbRefComments.push({ uid: myUid, text: text, timestamp: Date.now() });
            input.value = '';
        }

        let lastTap = 0;
        imgRef.addEventListener('click', (e) => {
            const now = Date.now();
            if (now - lastTap < 300) {
                toggleLike();
                popHeart.style.animation = 'none'; 
                void popHeart.offsetHeight; 
                popHeart.style.animation = 'heartPop 0.6s ease-out forwards';
            } else {
                setTimeout(() => { if (Date.now() - lastTap >= 300 && window.innerWidth > 768) toggleZoom(); }, 300);
            }
            lastTap = now;
        }, { passive: true });

        function openCommentDrawer(e) { e.stopPropagation(); document.getElementById('comment-drawer').classList.add('active'); }
        function closeCommentDrawer() { document.getElementById('comment-drawer').classList.remove('active'); }
        document.getElementById('comment-input').addEventListener('keypress', function(e) { if (e.key === 'Enter') addComment(); });
        function toggleZoom() { isZoomMode = !isZoomMode; if (isZoomMode) lightbox.classList.add('zoom-active'); else { lightbox.classList.remove('zoom-active'); resetZoom(); } }
        function resetZoom() { scale = 1; translateX = 0; translateY = 0; updateTransform(); }
        function updateTransform() { imgRef.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; }
        function closeLightbox(event) { if (event.target.id === 'lightbox' || event.target.id === 'img-box') forceCloseLightbox(); }
        function forceCloseLightbox() { lightbox.classList.remove('active'); lightbox.classList.remove('zoom-active'); isZoomMode = false; document.body.style.overflow = ''; setTimeout(() => lightbox.style.display = 'none', 350); }
    </script>
</body>
</html>
