<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11-V Family | Vinetka Albomi</title>
    <style>
        /* Bosh sahifa bilan bir xil glassmorphic gradient va ranglar */
        :root {
            --bg-gradient: linear-gradient(135deg, #060913 0%, #0b1528 50%, #1a102f 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-hover: rgba(59, 130, 246, 0.4);
            --text-main: #f3f4f6;
            --accent-glow: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navigatsiya menyusi */
        header {
            background-color: rgba(6, 9, 19, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%;
            max-width: 1200px;
            margin: auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Ichki sahifalar uchun sarlavha qismi */
        .page-header {
            padding-top: 160px;
            padding-bottom: 40px;
            text-align: center;
        }

        .page-title {
            font-size: 3rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .page-subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Vinetka o'quvchilar seti (Grid) */
        .vinetka-section {
            padding: 20px 5% 100px;
            max-width: 1200px;
            margin: auto;
        }

        .vinetka-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2.5rem;
        }

        .student-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        /* O'quvchilar kartasi - Shaffof shisha */
        .student-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease, border-color 0.4s ease;
        }

        /* Hover effekti */
        .student-link:hover .student-card {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--glass-border-hover);
            box-shadow: 0 12px 40px 0 rgba(59, 130, 246, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .student-img-wrapper {
            width: 100%;
            height: 320px;
            overflow: hidden;
            position: relative;
            background: rgba(255, 255, 255, 0.01);
        }

        .student-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .student-link:hover .student-card img {
            transform: scale(1.05);
        }

        .student-info {
            padding: 1.5rem;
            text-align: center;
            border-top: 1px solid var(--glass-border);
        }

        .student-info h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
        }

        .student-info p {
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 0.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        footer {
            background: rgba(6, 9, 19, 0.7);
            backdrop-filter: blur(10px);
            text-align: center;
            padding: 2.5rem;
            border-top: 1px solid var(--glass-border);
            color: #64748b;
            font-weight: 500;
        }

        /* Mobil moslashuvchanlik */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .page-title { font-size: 2.2rem; }
            .page-subtitle { font-size: 1rem; }
            .vinetka-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; }
            .student-img-wrapper { height: 260px; }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo">11-V Family</div>
            <ul class="nav-links">
                <li><a href="index.html">Bosh sahifa</a></li>
                <li><a href="vinetka.html" style="color: #ffffff; text-shadow: 0 0 10px var(--accent-glow);">Vinetka rasmlari</a></li>
                <li><a href="index.html#esdalik-rasmlar">Esdalik rasmlar</a></li>
            </ul>
        </nav>
    </header>

    <div class="page-header">
        <h1 class="page-title">Sinfdoshlar Vinetkasi</h1>
        <p class="page-subtitle">Har bir bitiruvchining shaxsiy albomi va unutilmas xotiralari</p>
    </div>

    <section class="vinetka-section">
        <div class="vinetka-grid">
            
            <!-- 1-O'QUVCHI: SOHIBA -->
            <a href="sohiba.html" class="student-link">
                <div class="student-card">
                    <div class="student-img-wrapper">
                        <!-- Profil muqovasi (Yuklanmasa ikkinchi JPG format tekshiradi) -->
                        <img src="Sohiba/sohiba (11).jpg" alt="Sohiba" onerror="this.src='Sohiba/sohiba (11).JPG'">
                    </div>
                    <div class="student-info">
                        <h3>Sohiba</h3>
                        <p>Bitiruvchi</p>
                    </div>
                </div>
            </a>

            <!-- 2-O'QUVCHI: DIANA -->
            <a href="diana.html" class="student-link">
                <div class="student-card">
                    <div class="student-img-wrapper">
                        <img src="Diana/diana (11).jpg" alt="Diana" onerror="this.src='Diana/diana (11).JPG'">
                    </div>
                    <div class="student-info">
                        <h3>Diana</h3>
                        <p>Bitiruvchi</p>
                    </div>
                </div>
            </a>

            <!-- QOLGAN 30 TA O'QUVCHINI HAM XUDDI SHU TARTIBDA KO'PAYTIRIB CHIQASIZ -->

        </div>
    </section>

    <footer>
        <p>&copy; 2026 11-V Family. Barcha huquqlar himoyalangan.</p>
    </footer>

</body>
</html>
